[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milkchan"
version = "1.0.0"
description = "Desktop companion character: the body of the SentientMilk brain"
authors = [
    {name = "MilkChan Team"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "companion", "desktop", "pyqt5", "sentientmilk"]

dependencies = [
    "requests>=2.32.3",
    "Pillow>=10.4.0",
    "PyQt5>=5.15.10",
    "mss>=9.0.1",
    "markdown2>=2.5.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
milkchan = "milkchan.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["milkchan*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
